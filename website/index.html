<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexora Studio — ستوديو التكنولوجيا والابتكار الرقمي</title>
  <meta name="description" content="Vexora Studio — تصميم وتطوير المواقع، تطبيقات Android، الذكاء الاصطناعي، والهوية البصرية." />
  <link id="faviconLink" rel="icon" type="image/jpeg" href="../app/src/main/res/drawable/app_icon_vexora.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="glow glow-cyan"></div>
    <div class="glow glow-blue"></div>
  </div>

  <!-- TopAppBar -->
  <header class="top-app-bar">
    <div class="topbar-start">
      <button id="mobileMenuBtn" class="icon-btn" type="button" aria-label="Menu">☰</button>
      <button id="brandHomeBtn" class="brand-btn" type="button">
        <svg class="brand-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="vxGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#00D4FF" />
              <stop offset="100%" stop-color="#2979FF" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="44" height="44" rx="12" fill="#0B1120" stroke="url(#vxGrad)" stroke-width="2" />
          <path d="M13 15L24 34L35 15" stroke="url(#vxGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M19 15L24 24L29 15" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
        </svg>
        <span class="brand-name">Vexora Studio</span>
      </button>
    </div>

    <div class="topbar-actions">
      <button id="langToggleBtn" class="lang-chip" type="button" aria-label="Toggle Language">
        <span>🌐</span>
        <span id="langToggleLabel">EN</span>
      </button>
    </div>
  </header>

  <!-- App Shell: NavigationRail + Screen Container -->
  <div class="app-shell">
    <aside id="navRail" class="nav-rail" aria-label="Primary Navigation"></aside>
    <main class="main-content">
      <div id="screenContainer" class="screen-container"></div>
    </main>
  </div>

  <!-- Mobile Bottom NavigationBar -->
  <nav id="bottomNav" class="bottom-nav" aria-label="Bottom Navigation"></nav>

  <!-- ModalNavigationDrawer -->
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawerSheet" class="drawer-sheet" hidden aria-label="Navigation Drawer">
    <div class="drawer-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <svg class="brand-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="2" y="2" width="44" height="44" rx="12" fill="#0B1120" stroke="#00D4FF" stroke-width="2" />
          <path d="M13 15L24 34L35 15" stroke="#00D4FF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div>
          <div class="brand-name">Vexora Studio</div>
          <span id="drawerTagline" class="brand-sub">ستوديو التكنولوجيا والابتكار الرقمي</span>
        </div>
      </div>
    </div>
    <div id="drawerNavList"></div>
  </aside>

  <!-- Generic Dialog Modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" hidden>
    <div class="glass-card modal-card highlight-border">
      <div class="row-between">
        <h3 id="modalTitle" class="card-title" style="color:var(--neon-cyan);"></h3>
        <button id="closeModalBtn" type="button" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="modalBody" class="stack-list"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
