<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexora Studio — شركة هندسة البرمجيات وتطوير المواقع وتطبيقات Android</title>
  <meta name="description" content="Vexora Studio — شركة برمجيات وهندسة رقمية متخصصة في تطوير المواقع، تطبيقات Android، والأنظمة البرمجية المتكاملة." />
  <meta name="theme-color" content="#050811" />
  <meta property="og:title" content="Vexora Studio — Software Engineering Studio" />
  <meta property="og:description" content="تطوير المواقع، تطبيقات Android الأصلية، والأنظمة البرمجية المتقدمة." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="website/vexora-logo.png" />
  <link id="faviconLink" rel="icon" type="image/png" href="website/vexora-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="website/styles.css?v=20261126c" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-3d-grid"></div>
    <div class="ambient-cube-float">
      <span class="ambient-cube-face f1"></span>
      <span class="ambient-cube-face f2"></span>
      <span class="ambient-cube-face f3"></span>
      <span class="ambient-cube-face f4"></span>
      <span class="ambient-cube-face f5"></span>
      <span class="ambient-cube-face f6"></span>
    </div>
    <div class="ambient-cube-float alt">
      <span class="ambient-cube-face f1"></span>
      <span class="ambient-cube-face f2"></span>
      <span class="ambient-cube-face f3"></span>
      <span class="ambient-cube-face f4"></span>
      <span class="ambient-cube-face f5"></span>
      <span class="ambient-cube-face f6"></span>
    </div>
    <div class="glow glow-cyan"></div>
    <div class="glow glow-blue"></div>
  </div>

  <!-- TopAppBar -->
  <header class="top-app-bar">
    <div class="topbar-start">
      <button id="mobileMenuBtn" class="icon-btn" type="button" aria-label="Menu">☰</button>
      <button id="brandHomeBtn" class="brand-btn" type="button">
        <img class="brand-svg" src="website/vexora-logo.png" alt="Vexora Studio" />
        <span class="brand-name">Vexora Studio</span>
      </button>
    </div>

    <div class="topbar-actions">
      <button id="topbarDownloadBtn" class="lang-chip" type="button" aria-label="Download Android APK">
        <span>📲</span>
        <span id="topbarDownloadLabel">APK</span>
      </button>
      <button id="langToggleBtn" class="lang-chip" type="button" aria-label="Toggle Language">
        <span>🌐</span>
        <span id="langToggleLabel">EN</span>
      </button>
    </div>
  </header>

  <!-- App Shell: NavigationRail + Screen Container -->
  <div class="app-shell">
    <aside id="navRail" class="nav-rail" aria-label="Primary Navigation"></aside>
    <main class="main-content">
      <div id="screenContainer" class="screen-container"></div>
    </main>
  </div>

  <!-- Mobile Bottom NavigationBar -->
  <nav id="bottomNav" class="bottom-nav" aria-label="Bottom Navigation"></nav>

  <!-- ModalNavigationDrawer -->
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawerSheet" class="drawer-sheet" hidden aria-label="Navigation Drawer">
    <div class="drawer-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img class="brand-svg" src="website/vexora-logo.png" alt="Vexora Studio" />
        <div>
          <div class="brand-name">Vexora Studio</div>
          <span id="drawerTagline" class="brand-sub">ستوديو التكنولوجيا والابتكار الرقمي</span>
        </div>
      </div>
    </div>
    <div id="drawerNavList"></div>
  </aside>

  <!-- Generic Dialog Modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" hidden>
    <div class="glass-card modal-card highlight-border">
      <div class="row-between">
        <h3 id="modalTitle" class="card-title" style="color:var(--neon-cyan);"></h3>
        <button id="closeModalBtn" type="button" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="modalBody" class="stack-list"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="website/app.js?v=20261126c"></script>
</body>
</html>
